name: Build Switch (.nro)

on:
  workflow_dispatch:
  push:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar SDL2 para Switch
        run: dkp-pacman -Syu --noconfirm switch-sdl2 switch-sdl2_image switch-sdl2_mixer || true
      - name: Compilar
        run: make -f Makefile.switch sd -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: pk2-switch-sd
          path: switch/sd/
